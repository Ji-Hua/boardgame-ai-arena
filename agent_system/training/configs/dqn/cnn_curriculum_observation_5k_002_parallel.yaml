# CNN DQN training — 5000-episode curriculum observation run.
#
# Purpose: Short run to validate the full training system end-to-end:
#   - YAML config loading
#   - Episode-based training curriculum
#   - Structured metrics artifacts
#   - Per-opponent evaluation with eval_results.jsonl
#   - Sampled offline evaluation replays for dashboard review
#
# Curriculum:
#   Phase 1 (ep    1-1000): random_legal 100% / minimax_d1 0%
#   Phase 2 (ep 1001-2000): random_legal 80% / minimax_d1 20%
#   Phase 3 (ep 2001-3000): random_legal 60% / minimax_d1 40%
#   Phase 4 (ep 3001-4000): random_legal 40% / minimax_d1 60%
#   Phase 5 (ep 4001-5000): random_legal 20% / minimax_d1 80%
#   Phase 6 (ep 5001+):     random_legal 0% / minimax_d1 100% (won't execute when episodes=5000)
#
# All CNN / DDQN / reward parameters are identical to
# cnn_curriculum_random_to_minimax_5k_001.yaml for apples-to-apples comparison.
#
# Run with:
#   PYTHONPATH=. PYTHONUNBUFFERED=1 uv run python -u scripts/train_dqn.py \
#     --config agent_system/training/configs/dqn/cnn_curriculum_observation_5k_002_parallel.yaml \
#     2>&1 | tee agent_system/training/artifacts/dqn/cnn_curriculum_observation_5k_002_parallel/train.log

# --- episode budget ---
episodes: 5000
max_steps_per_episode: 3000

# --- replay buffer ---
buffer_capacity: 100000
warmup_size: 5000
batch_size: 128

# --- optimizer ---
lr: 1.0e-4
gamma: 0.95
grad_clip_norm: 10.0

# --- exploration ---
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 200000

# --- target network ---
target_sync_interval: 200

# --- checkpointing ---
checkpoint_dir: agent_system/training/artifacts/dqn/cnn_curriculum_observation_5k_002_parallel/checkpoints
checkpoint_interval: 500
agent_id: dqn_cnn_curriculum_observation_5k_002_parallel

# --- episode-based curriculum schedule ---
train_opponent_schedule:
  - from_episode: 1
    to_episode: 1000
    opponent:
      type: mixed
      opponents:
        - name: random_legal
          type: random_legal
          weight: 1.0

  - from_episode: 1001
    to_episode: 2000
    opponent:
      type: mixed
      opponents:
        - name: random_legal
          type: random_legal
          weight: 0.8
        - name: minimax_d1
          type: minimax
          depth: 1
          weight: 0.2

  - from_episode: 2001
    to_episode: 3000
    opponent:
      type: mixed
      opponents:
        - name: random_legal
          type: random_legal
          weight: 0.6
        - name: minimax_d1
          type: minimax
          depth: 1
          weight: 0.4

  - from_episode: 3001
    to_episode: 4000
    opponent:
      type: mixed
      opponents:
        - name: random_legal
          type: random_legal
          weight: 0.4
        - name: minimax_d1
          type: minimax
          depth: 1
          weight: 0.6

  - from_episode: 4001
    to_episode: 5000
    opponent:
      type: mixed
      opponents:
        - name: random_legal
          type: random_legal
          weight: 0.2
        - name: minimax_d1
          type: minimax
          depth: 1
          weight: 0.8

  - from_episode: 5001
    opponent:
      type: minimax
      depth: 1



# --- evaluation ---
evaluation:
  interval: 500
  games_per_opponent: 200
  replay_sample_every: 100
  opponents:
    - name: pawn_random
      type: pawn_random
    - name: random_legal
      type: random_legal
    - name: minimax_d1
      type: minimax
      depth: 1
    - name: minimax_d2
      type: minimax
      depth: 2

# --- observation / model ---
obs_version: v1
model_arch: cnn
cnn_channels: [32, 64, 64]
algorithm: double_dqn

# --- reward ---
reward_mode: distance_delta
distance_reward_weight: 0.04
distance_delta_clip: 1.0

# --- misc ---
seed: 42
log_interval: 100

parallel_rollout:
  enabled: true
  num_workers: 4
  batch_transitions_per_worker: 256
  queue_maxsize: 8
  start_method: spawn
