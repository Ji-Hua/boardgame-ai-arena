# Training Dashboard — Docker Compose
#
# Usage:
#   cd training-dashboard
#   docker compose up --build
#
# Frontend:  http://localhost:8741
# Backend:   http://localhost:8740/health
#
# Artifact volumes are mounted read-only from the host.
# Override TRAINING_DASHBOARD_ARTIFACT_ROOTS if your artifacts live elsewhere.

services:
  training-dashboard:
    build:
      context: ..
      dockerfile: training-dashboard/Dockerfile
    ports:
      - "8740:8740"
      - "8741:8741"
    volumes:
      # Mount training artifacts read-only.
      # The host path is relative to this file (training-dashboard/).
      - ${TRAINING_ARTIFACTS_DIR:-../agent_system/training/artifacts}:/data/training_artifacts:ro
      - ${QUORIDOR_DATA_DIR:-/home/jihua/quoridor-data}:/data/quoridor:ro
    environment:
      # Colon-separated list of container paths to scan for training runs.
      # DQN artifacts are nested under /dqn — list both so the backend
      # sees individual run directories whichever layout is present.
      TRAINING_DASHBOARD_ARTIFACT_ROOTS: "/data/training_artifacts/dqn:/data/training_artifacts"
      QUORIDOR_DATA_ROOT: "/data/quoridor"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://192.168.68.88:8742}"
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8740/health', timeout=3); urllib.request.urlopen('http://localhost:8741/', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
