services:
  runtime:
    image: ${RUNTIME_IMAGE:?required}
    env_file: ["${RELEASE_DIR}/runtime.env"]
    ports: ["192.168.68.88:8783:8743"]
    volumes: ["/home/jihua/quoridor-data:/home/jihua/quoridor-data:ro"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
  lab:
    image: ${RUNTIME_IMAGE:?required}
    env_file: ["${RELEASE_DIR}/lab.env"]
    command: [python, -m, uvicorn, "agent_system.analysis.app:app", --host, "0.0.0.0", --port, "8744"]
    volumes: ["/home/jihua/quoridor-data:/home/jihua/quoridor-data:ro"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
  platform:
    image: ${WEB_IMAGE:?required}
    env_file: ["${RELEASE_DIR}/platform.env"]
    ports: ["192.168.68.88:8781:8741"]
    volumes:
      - /home/jihua/quoridor-data:/home/jihua/quoridor-data:ro
      - /home/jihua/workspace/boardgame-ai-arena/agent_system/training/artifacts:/data/training_artifacts:ro
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  gateway:
    image: ${GATEWAY_IMAGE:?required}
    environment:
      PLATFORM_UPSTREAM: platform:8741
      # Legacy 8740/8741 stack, retired in P4; its gateway image predates /api/v1/play.
      GAMEPLAY_UPSTREAM: platform:8741
      JOBS_UPSTREAM: host.docker.internal:18796
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${GATEWAY_BIND:?required}:8080"]
    depends_on: [platform]
    restart: unless-stopped
